name: Build and test DesktopRanger

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launchers:
    name: ${{ matrix.edition }} Release x64 (build only)
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Stable-candidate
            project: desktop.ranger.stable/desktop.ranger.stable.vcxproj
            executable: DesktopRanger.Stable.exe
          - edition: Research
            project: desktop.ranger/desktop.ranger.launcher.vcxproj
            executable: Desktop.Ranger.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild was not found."
          }

          Write-Host "MSBuild path: $msbuild"
          "MSBUILD_PATH=$msbuild" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build only selected launcher and its dependencies
        shell: pwsh
        run: |
          & "$env:MSBUILD_PATH" "${{ matrix.project }}" `
            /m /nr:false `
            "/p:SolutionDir=$env:GITHUB_WORKSPACE\" `
            /p:Configuration=Release /p:Platform=x64 /p:PreferredToolArchitecture=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload candidate (not a validated production release)
        uses: actions/upload-artifact@v4
        with:
          name: DesktopRanger-${{ matrix.edition }}-x64
          path: .output/Release/${{ matrix.executable }}
          if-no-files-found: error

  tests:
    name: GoogleTest and current-Desktop integration
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild was not found."
          }

          Write-Host "MSBuild path: $msbuild"
          "MSBUILD_PATH=$msbuild" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and run unit tests without building launchers or PoCs
        shell: pwsh
        run: .\scripts\BuildAndTest.ps1 -Configuration Release -TestsOnly

      - name: Build functional runner and precompiled probe
        shell: pwsh
        run: |
          & "$env:MSBUILD_PATH" .\desktop.ranger.functional\desktop.ranger.functional.vcxproj `
            /m /nr:false `
            "/p:SolutionDir=$env:GITHUB_WORKSPACE\" `
            /p:Configuration=Release /p:Platform=x64 /p:PreferredToolArchitecture=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run current-Desktop integration (no switching or ACL changes)
        shell: pwsh
        run: .\scripts\RunFunctionalTests.ps1 -Configuration Release

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: DesktopRanger-Test-Results
          path: |
            .output/Release/logs/
            .output/Release/functional/
          if-no-files-found: warn

  research-examples:
    name: Independent example ${{ matrix.project }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        project:
          - check_app_container/check_app_container.vcxproj
          - zis_probe/zis_probe.vcxproj
          - simple.desktop.console/simple.desktop.console.vcxproj
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild was not found."
          }

          Write-Host "MSBuild path: $msbuild"
          "MSBUILD_PATH=$msbuild" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build standalone example (never execute it)
        shell: pwsh
        run: |
          & "$env:MSBUILD_PATH" "${{ matrix.project }}" `
            /m /nr:false `
            "/p:SolutionDir=$env:GITHUB_WORKSPACE\" `
            /p:Configuration=Release /p:Platform=x64 /p:PreferredToolArchitecture=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
